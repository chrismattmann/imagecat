name: build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: PGE Python 3 checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Only what the tests import. requirements.txt pulls torch, which
      # this job has no use for; tests/test_imagespace_config.py imports
      # server.solr to check it still imports, and that needs httpx. A
      # skip would defeat the one thing that test is for.
      - name: Install test dependencies
        run: python -m pip install --quiet httpx fastapi numpy faiss-cpu Pillow portalocker

      - name: Test
        # Discovery rather than a list: the list had already lost
        # tests/test_imagespace_config.py, and a test that is written but
        # never run is worse than no test, because it reads as coverage.
        # It was also failing, which is the other thing a list hides.
        run: python -m unittest discover -s tests -t . -v

      # imagespace/tests was never run anywhere: eight files, and the ninth
      # would have joined them. Its own tree, so its own discover.
      - name: Test ImageSpace
        working-directory: imagespace
        run: python -m unittest discover -s tests -t . -v

  imagespace-web:
    name: ImageSpace Vue
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imagespace/web
    steps:
      - uses: actions/checkout@v4
        with:
          # The audit gate blocks only when this change touched the dependency
          # tree, and deciding that needs a base commit to diff against.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: imagespace/web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
      # Whether an npm advisory should fail this build depends on whether
      # this change could have caused it. npm audit queries a live advisory
      # database, so its answer moves on its own: a pull request touching Java
      # or Python can go red because somebody published an advisory about vue
      # overnight. That failure is not actionable by its author, and a job that
      # fails for reasons unrelated to the change is a job people learn to
      # ignore -- which is how a real finding gets waved through later.
      #
      # A change that touches package.json or package-lock.json is the one case
      # where a new advisory is this change's doing, so that is where the gate
      # blocks. Drift in a tree nobody touched is still worth knowing about,
      # and .github/workflows/audit.yml opens an issue for it weekly, which is
      # the right shape for "go upgrade something" work.
      - name: Did this change touch the dependency tree?
        id: deps
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          watched="imagespace/web/package.json imagespace/web/package-lock.json"

          case "${{ github.event_name }}" in
            pull_request) base="origin/${{ github.base_ref }}" ;;
            push)         base="${{ github.event.before }}" ;;
            # A manual run is somebody asking the question, so answer it.
            *)            base="" ;;
          esac

          mode=gate
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit for a ${{ github.event_name }} event: gating"
          elif ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            # Gating is the safe answer when the diff cannot be computed: a
            # build that goes red prints the advisory and can be looked at,
            # whereas silently not gating a dependency change is the one thing
            # this gate exists to catch.
            echo "could not resolve [$base]: gating"
          else
            merge_base=$(git merge-base "$base" HEAD)
            changed=$(git diff --name-only "$merge_base" HEAD -- $watched)
            if [ -n "$changed" ]; then
              echo "dependency tree changed:"
              echo "$changed" | sed 's/^/  /'
            else
              echo "no change to $watched"
              mode=report
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: npm audit
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/npm_audit_gate.py" \
            --mode "${{ steps.deps.outputs.mode }}"

  windows:
    name: Windows build and runtime checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: imagespace/web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Python test dependencies
        run: python -m pip install --quiet httpx fastapi numpy faiss-cpu Pillow portalocker

      - name: Test cross-platform ImageSpace locking
        working-directory: imagespace
        run: python -m unittest tests.test_index_lock -v

      - name: Test Windows shell and mirroring policies
        run: >-
          python -m unittest
          tests.test_cross_platform_pge_shells
          tests.test_mirror_and_provenance.MirroringIsTheDefault -v

      - name: Validate Bash entry points
        shell: bash
        run: |
          bash -n distribution/src/main/resources/bin/imagecat
          bash -n pge/src/main/resources/bin/index-imagespace/index-imagespace.sh
          bash -n pge/src/main/resources/bin/index-imagespace-fgbg/index-imagespace-fgbg.sh
          bash -n pge/src/main/resources/bin/index-metadata-jaccard/index-metadata-jaccard.sh

      - name: Validate PowerShell launchers
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'distribution/src/main/resources/bin/imagecat.ps1'),
            [ref]$null, [ref]$errors)
          if ($errors) { throw ($errors | Out-String) }
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'distribution/src/main/resources/bin/oodt.ps1'),
            [ref]$null, [ref]$errors)
          if ($errors) { throw ($errors | Out-String) }

      - name: Test and build ImageSpace web app
        working-directory: imagespace/web
        run: |
          npm ci
          npm test
          npm run build

      - name: Package ImageCat on Windows
        run: mvn -B package

      - name: Check Windows launchers are packaged
        shell: pwsh
        run: |
          $tarball = Get-ChildItem distribution/target/oodt-distribution-*-bin.tar.gz | Select-Object -First 1
          if (-not $tarball) { throw 'ImageCat distribution tarball was not built' }
          $entries = tar tzf $tarball.FullName
          foreach ($entry in @('bin/imagecat.ps1', 'bin/oodt.ps1', 'solr-server/bin/solr.cmd')) {
            if ($entries -notcontains $entry) { throw "$entry is missing from the distribution" }
          }

  package:
    name: Maven package (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The Solr tarball is 343MB and both Apache hosts serve it at about
      # 380KB/s, so fetching it costs fifteen minutes -- most of this job's
      # runtime before this step existed.
      #
      # Keyed on distribution/pom.xml because that is where solr.version is
      # declared. Hashing the root pom instead looks fine until the next Solr
      # upgrade: the key would not change, the stale tarball would be
      # restored, the build would correctly re-download the new one, and the
      # save would then be skipped because the key already exists. The cache
      # would quietly never hold the new version again.
      - name: Cache the Solr distribution
        uses: actions/cache@v4
        with:
          path: ~/.cache/imagecat-solr
          key: solr-${{ hashFiles('distribution/pom.xml') }}
          restore-keys: solr-

      - name: Package ImageCat
        run: mvn -B package

      - name: Check the distribution contents
        run: |
          set -e
          TARBALL=distribution/target/oodt-distribution-*-bin.tar.gz
          test -f $TARBALL

          tar tzf $TARBALL | grep -q 'tomcat/webapps/opsui/'
          tar tzf $TARBALL | grep -q 'solr/imagecat/conf/schema.xml'
          tar tzf $TARBALL | grep -q 'solr/oodt-fm/conf/schema.xml'
          tar tzf $TARBALL | grep -q 'pge/bin/imagecat-ocr/imagecat-ocr.py'
          tar tzf $TARBALL | grep -q 'pge/bin/solr_url.py'
          tar tzf $TARBALL | grep -q 'solr-server/bin/solr'
          tar tzf $TARBALL | grep -q 'bin/imagecat$'
          tar tvzf $TARBALL | grep -E 'tomcat/bin/catalina.sh' | grep -q '^-rwx'
          tar tvzf $TARBALL | grep -E 'bin/imagecat$' | grep -q '^-rwx'

          # One port, one set of URLs: SOLR_PORT in bin/setenv.sh. A literal
          # here is how a run indexes nothing and still reports success.
          # Assert the files are present first, or an empty grep passes.
          tar tzf $TARBALL | grep -q 'workflow/policy/tasks.xml'
          tar tzf $TARBALL | grep -q 'filemgr/etc/filemgr.properties'
          ! tar xzOf $TARBALL --wildcards 'workflow/policy/tasks.xml' | grep -q '8983'
          ! tar xzOf $TARBALL --wildcards 'filemgr/etc/filemgr.properties' | grep -q '8983'

          ! tar tzf $TARBALL | grep -q 'solr4/'
          ! tar tzf $TARBALL | grep -q 'tomcat7/'
          ! tar xzOf $TARBALL --wildcards '*/bin/*' 2>/dev/null | grep -q 'java.ext.dirs'
          ! tar xzOf $TARBALL --wildcards '*/WEB-INF/web.xml' 2>/dev/null | grep -qi wicket

          # W2 on HSQLDB. The schema must be creatable before the workflow
          # manager takes the file lock, so all three of these have to ship.
          # No '*/' prefix: this tarball has no top-level directory, and a
          # leading wildcard would match nothing (DRAT#263 learned that the
          # loud way).
          tar tzf $TARBALL | grep -q '^workflow/lib/hsqldb-'
          tar tzf $TARBALL | grep -q '^workflow/lib/oodt-extensions-'

          PROPS=$(tar xzOf $TARBALL workflow/etc/workflow.properties)
          echo "$PROPS" | grep -q 'workflow.engine.factory *= *org.apache.oodt.cas.workflow.engine.PrioritizedQueueBasedWorkflowEngineFactory'
          echo "$PROPS" | grep -q 'workflow.wengine.runner.factory *= *org.apache.oodt.cas.workflow.engine.runner.AsynchronousLocalEngineRunnerFactory'
          echo "$PROPS" | grep -q 'instanceRep.factory *= *org.apache.oodt.cas.workflow.instrepo.DataSourceWorkflowInstanceRepositoryFactory'

          # The tool and the schema both come from cas-workflow now; ImageCat
          # carried copies of each until Mnemosyne 1.13.1.
          WF=$(tar tzf $TARBALL | grep -E '^workflow/lib/cas-workflow-.*\.jar$' | head -1)
          test -n "$WF"
          tar xzOf $TARBALL "$WF" > /tmp/cas-workflow.jar
          unzip -l /tmp/cas-workflow.jar | grep -q 'org/apache/oodt/cas/workflow/instrepo/WorkflowInstanceSchema.class'
          unzip -l /tmp/cas-workflow.jar | grep -q ' workflow.sql$'
          ! tar tzf $TARBALL | grep -q 'workflow/etc/workflow-instances.sql'

          echo "distribution contents OK"
