name: build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: PGE Python 3 checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        run: python -m unittest tests.test_pge_python -v

  imagespace-web:
    name: ImageSpace Vue
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imagespace/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: imagespace/web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: npm audit
        run: |
          # npm 10 still posts to the retired audits/quick endpoint, which
          # 400s "Invalid package tree" after a clean npm ci and blocks the
          # PR. Fail only when the API actually reports high/critical.
          python3 - <<'PY'
          import json, subprocess, sys
          proc = subprocess.run(
              ["npm", "audit", "--json"], capture_output=True, text=True
          )
          raw = proc.stdout or proc.stderr or ""
          try:
              body = json.loads(raw)
          except ValueError:
              print("npm audit did not return JSON (exit %s); not blocking"
                    % proc.returncode)
              sys.exit(0)
          if body.get("statusCode") or body.get("error"):
              print("npm audit endpoint error:",
                    body.get("message") or body.get("error"))
              sys.exit(0)
          vulns = (body.get("metadata") or {}).get("vulnerabilities") or {}
          high = int(vulns.get("high") or 0) + int(vulns.get("critical") or 0)
          print("vulnerabilities:", json.dumps(vulns))
          sys.exit(1 if high else 0)
          PY

  package:
    name: Maven package (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package ImageCat
        run: mvn -B package

      - name: Check the distribution contents
        run: |
          set -e
          TARBALL=distribution/target/oodt-distribution-*-bin.tar.gz
          test -f $TARBALL

          tar tzf $TARBALL | grep -q 'tomcat/webapps/opsui/'
          tar tzf $TARBALL | grep -q 'solr/imagecat/conf/schema.xml'
          tar tzf $TARBALL | grep -q 'solr/oodt-fm/conf/schema.xml'
          tar tzf $TARBALL | grep -q 'pge/bin/imagecat-ocr/imagecat-ocr.py'
          tar tzf $TARBALL | grep -q 'solr-server/bin/solr'
          tar tzf $TARBALL | grep -q 'bin/imagecat$'
          tar tvzf $TARBALL | grep -E 'tomcat/bin/catalina.sh' | grep -q '^-rwx'
          tar tvzf $TARBALL | grep -E 'bin/imagecat$' | grep -q '^-rwx'

          ! tar tzf $TARBALL | grep -q 'solr4/'
          ! tar tzf $TARBALL | grep -q 'tomcat7/'
          ! tar xzOf $TARBALL --wildcards '*/bin/*' 2>/dev/null | grep -q 'java.ext.dirs'
          ! tar xzOf $TARBALL --wildcards '*/WEB-INF/web.xml' 2>/dev/null | grep -qi wicket

          echo "distribution contents OK"
